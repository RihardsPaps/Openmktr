name: GNU-free build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  chimera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build GNU-free test image
        run: docker build -t kati-test .
      - name: Run tests in Chimera
        run: docker run --rm kati-test
