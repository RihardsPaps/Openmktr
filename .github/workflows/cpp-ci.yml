name: Openmktr build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  chimera:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Openmktr test image
        run: |
          set -o pipefail
          docker build --build-arg OMKTR_SOURCE_REVISION=${{ github.sha }} -t openmktr-test . 2>&1 | tee build.log
      - name: Check changed C++ formatting
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          base="${PR_BASE:-$PUSH_BASE}"
          files=$(git diff --name-only --diff-filter=ACMRT "$base" "$GITHUB_SHA" -- 'src/*.cc' 'src/*.h')
          if [ -n "$files" ]; then
            docker run --rm -e CLANG_FORMAT_FILES="$files" openmktr-test sh clang-format-check
          fi
      - name: Run tests in Chimera
        run: |
          set -o pipefail
          docker run --rm openmktr-test 2>&1 | tee tests.log
      - name: Check incremental campaign harness without GNU dependencies
        run: docker run --rm openmktr-test python tests/incremental_campaign.py
      - name: Compare incremental builds with external GNU Make
        shell: sh
        run: |
          docker build -f validation/incremental/Dockerfile -t openmktr-incremental .
          mkdir -p incremental-evidence
          status=0
          docker run --rm -v "$PWD/incremental-evidence:/evidence" openmktr-incremental || status=$?
          if [ "$status" -eq 3 ]; then
            echo '::warning::Incremental campaign found unnecessary rebuilding; see evidence'
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: incremental-evidence
          path: incremental-evidence/
          if-no-files-found: ignore
      - name: Run sanitizer checks in Chimera
        run: |
          set -o pipefail
          docker run --rm -e ASAN_OPTIONS=detect_leaks=0 openmktr-test /bin/sh -c '
            python tools/gen_sanitizer_build.py &&
            ninja -f build.sanitizer.ninja -j4 omktr-sanitized tests &&
            out/sanitized/find_test && out/sanitized/ninja_test &&
            out/sanitized/strutil_test &&
            out/sanitized/load_limit_test &&
            OMKTR_BINARY=/workspace/omktr-sanitized python tests/portage.py &&
            OMKTR_BINARY=/workspace/omktr-sanitized python tests/load_limits.py &&
            OMKTR_BINARY=/workspace/omktr-sanitized python tests/correctness.py &&
            OMKTR_BINARY=/workspace/omktr-sanitized python tests/workspace.py &&
            OMKTR_BINARY=/workspace/omktr-sanitized python tests/make_compat_regressions.py' 2>&1 | tee sanitizer.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: chimera-logs
          path: '*.log'
