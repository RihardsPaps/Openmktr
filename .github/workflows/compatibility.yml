# SPDX-License-Identifier: MPL-2.0
name: Optional external compatibility and benchmarks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/compatibility.yml'
      - 'validation/compatibility/**'
      - 'tests/ninja_jobserver.py'
      - 'tests/bench.py'
      - 'packaging/gentoo/**'
      - 'tests/portage.py'
      - 'tests/workspace.py'
      - 'tools/omktr_workspace.py'
      - 'tools/omktr_manager.py'
      - 'tests/manager.py'
      - 'tests/manager_frontend.py'
      - 'tests/manager_terminal.py'
      - 'tests/load_limits.py'
      - 'tests/portage_validation.py'
      - 'src/load_limit*'
      - 'src/flags.*'
      - 'src/exec.cc'
      - 'src/fileutil.*'
      - 'src/command.cc'
      - 'src/main.cc'
      - 'src/ninja.cc'

permissions:
  contents: read

jobs:
  environments:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        environment: [alpine, gentoo]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build independent toolchain image
        run: |
          set -o pipefail
          docker build --build-arg OMKTR_SOURCE_REVISION=${{ github.sha }} -f validation/compatibility/Dockerfile.${{ matrix.environment }} -t openmktr-compat . 2>&1 | tee build.log
      - name: Test direct, generated, recursive and Ninja FIFO scheduling
        run: |
          set -o pipefail
          docker run --rm openmktr-compat 2>&1 | tee tests.log
      - name: Publish phase and end-to-end benchmark samples
        run: docker run --rm openmktr-compat python3 tests/bench.py ./omktr > benchmark.json
      - name: Test opt-in Portage lifecycle and local overlay
        if: matrix.environment == 'gentoo'
        run: |
          mkdir -p portage-evidence
          image_id=$(docker image inspect --format '{{.Id}}' openmktr-compat)
          docker run --rm --cap-add SYS_ADMIN --cap-add NET_ADMIN --cap-add SYS_PTRACE \
            --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
            -e OMKTR_PORTAGE_VALIDATION=1 \
            -e OMKTR_VALIDATION_IMAGE_ID="$image_id" \
            -v "$PWD/portage-evidence:/portage-evidence" openmktr-compat \
            python3 validation/compatibility/portage.py --real-packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          archive: true
          name: compatibility-${{ matrix.environment }}
          path: |
            *.log
            benchmark.json
            portage-evidence/
  gnu-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t openmktr-test .
      - run: docker build -f validation/incremental/Dockerfile -t openmktr-reference .
      - name: Compare serial and parallel incremental builds
        shell: sh
        run: |
          mkdir -p evidence
          for jobs in 1 4; do
            status=0
            docker run --rm -v "$PWD/evidence:/evidence" openmktr-reference --make gmake --omktr /workspace/omktr --jobs "$jobs" --output "/evidence/j$jobs" || status=$?
            if [ "$status" -eq 3 ]; then
              echo '::warning::Unnecessary rebuilding; inspect evidence'
            elif [ "$status" -ne 0 ]; then
              exit "$status"
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          archive: true
          name: optional-gnu-reference
          path: evidence/
